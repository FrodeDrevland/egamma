name: Tests

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    # Pinned rather than ubuntu-latest: from October 2026 that label is Ubuntu
    # 26.04, for which actions/setup-python has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
      - name: Run conformance tests
        run: pytest tests/ -q